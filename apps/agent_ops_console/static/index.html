<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainFump · Agent Ops Console</title>
  <style>
    :root {
      --bg: #0b0f14; --panel: #131a22; --border: #24313d;
      --text: #dfe6ec; --muted: #7c8b99; --accent: #3ddc97;
      --ok: #2ea44f; --warn: #d29922; --block: #da3633; --mem: #a371f7;
      --llm: #58a6ff; --cost: #f0883e; --live: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.15rem; margin: 0; }
    header .sub { color: var(--muted); font-size: .85rem; }
    header .badge { margin-left: auto; font-size: .76rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .25rem .7rem; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; padding: 1rem 1.5rem; max-width: 1320px; margin: 0 auto; }
    @media (max-width: 950px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    section h2 { font-size: .95rem; margin: 0 0 .75rem; color: var(--accent); }
    .scenario { width: 100%; text-align: left; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .6rem .8rem; margin-bottom: .5rem; cursor: pointer; font-size: .88rem; }
    .scenario:hover { border-color: var(--accent); }
    .scenario .pillar { display: block; font-size: .7rem; color: var(--muted); margin-top: .2rem; }
    .scenario .desc { display: block; font-size: .74rem; color: var(--muted); margin-top: .3rem; line-height: 1.35; }
    .scenario .flag { display: inline-block; font-size: .65rem; border: 1px solid var(--border); border-radius: 4px; padding: .05rem .35rem; margin-top: .3rem; color: var(--llm); }
    .runheader { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .status { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: .25rem .7rem; border: 1px solid var(--border); }
    .status.ok { color: var(--ok); border-color: var(--ok); }
    .status.queued, .status.running { color: var(--llm); border-color: var(--llm); }
    .status.budget_exceeded, .status.max_steps, .status.llm_error, .status.rate_limited { color: var(--block); border-color: var(--block); }
    .live-dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--live); margin-right: .35rem; animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .costbadge { color: var(--cost); font-size: .8rem; }
    .answer { margin-top: .8rem; background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: .7rem .9rem; font-size: .86rem; white-space: pre-wrap; }
    .feed { margin-top: .4rem; background: #05080b; border: 1px solid var(--border); border-radius: 6px; padding: .6rem .7rem; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .78rem; max-height: 360px; overflow-y: auto; }
    .feed .line { display: grid; grid-template-columns: 20px 1fr auto; gap: .5rem; padding: .3rem 0; border-bottom: 1px dashed #1a232c; align-items: start; }
    .feed .line:last-child { border-bottom: 0; }
    .feed .line strong { text-transform: uppercase; font-size: .7rem; letter-spacing: .04em; }
    .feed .line .detail { color: var(--muted); word-break: break-word; }
    .feed .line .lat { color: var(--muted); font-size: .68rem; white-space: nowrap; }
    .feed .line.memory strong { color: var(--mem); }
    .feed .line.llm strong { color: var(--llm); }
    .feed .line.tool-ok strong { color: var(--ok); }
    .feed .line.tool-fail strong { color: var(--warn); }
    .feed .line.tool-block strong { color: var(--block); }
    .feed .waiting { color: var(--muted); font-style: italic; }
    .verdict { display: inline-block; font-size: .66rem; border-radius: 4px; padding: .05rem .35rem; margin-left: .3rem; border: 1px solid var(--border); color: var(--muted); }
    .verdict.wasm { color: var(--accent); border-color: var(--accent); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 950px) { .cols { grid-template-columns: 1fr; } }
    .narrative { margin: 0; padding-left: 1.1rem; font-size: .82rem; line-height: 1.55; }
    .kv { font-size: .8rem; line-height: 1.6; }
    .kv .k { color: var(--muted); }
    .runrow { display: flex; justify-content: space-between; gap: .5rem; font-size: .76rem; padding: .35rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .runrow .goal { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .runrow .st { color: var(--muted); }
    #placeholder { color: var(--muted); font-size: .85rem; }
    .spent { font-size: .78rem; color: var(--muted); margin-top: .4rem; }
    .spent b { color: var(--cost); }
    .noisy-hint { display: flex; gap: .5rem; margin-top: .4rem; }
    .noisy-hint button { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .35rem .6rem; font-size: .75rem; cursor: pointer; }
    .rate-banner { margin-top: .5rem; border: 1px solid var(--block); color: var(--block); border-radius: 6px; padding: .5rem .7rem; font-size: .8rem; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📡 BrainFump · Agent Ops Console</h1>
    <span class="sub">Async Runs, Live-Streaming und Backpressure des Agent Execution Layer — in Echtzeit.</span>
    <span class="badge" id="llm-mode">…</span>
  </header>
  <main>
    <div>
      <section>
        <h2>Szenarien</h2>
        <div id="scenario-list"></div>
        <div class="noisy-hint">
          <button id="fire-x3">🐝 noisy_neighbor 3× hintereinander</button>
        </div>
        <div class="rate-banner" id="rate-banner"></div>
      </section>
      <section>
        <h2>Letzte Runs</h2>
        <div id="run-list"></div>
        <div class="spent" id="tenant-spent"></div>
      </section>
    </div>
    <div>
      <section>
        <h2>Run</h2>
        <div id="placeholder">Wähle links ein Szenario — der Live-Feed erscheint hier, während der Agent arbeitet.</div>
        <div id="run-view" style="display:none">
          <div class="runheader">
            <span class="status" id="run-status"></span>
            <span class="costbadge" id="run-cost"></span>
            <span class="sub" id="run-id"></span>
          </div>
          <div class="feed" id="feed"></div>
          <div class="answer" id="run-answer" style="display:none"></div>
        </div>
      </section>
      <div class="cols">
        <section>
          <h2>xAI — Warum diese Antwort?</h2>
          <ol class="narrative" id="narrative"></ol>
        </section>
        <section>
          <h2>Kosten-Breakdown</h2>
          <div class="kv" id="cost-breakdown"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
