[project]
name = "brainfump"
version = "0.2.0"
description = "BrainFump NextGen — Agentic Memory Kernel für aktenbasierte GenAI-Systeme"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brainfump"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
