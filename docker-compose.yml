# BrainFump NextGen — Anwendungs-Suite
#
#   docker compose up -d          → alle vier Apps
#   docker compose up -d <name>   → einzelne App
#
# Portschema:
#   8010  agentic-akte        Aktenführung mit Gedächtnis-Gate
#   8020  coding-agent-guard  PROJECTMEM-Wächter für Coding Agents
#   8030  prompt-optimizer    Prompt-Testlabor mit Langzeitgedächtnis
#   8040  memory-house        Das Haus, das sich erinnert 🏠
#   8050  memory-cockpit      Cognitive Core sichtbar: Graph + Live-Gatekeeper 🧭

services:
  agentic-akte:
    build:
      context: .
      dockerfile: apps/agentic_akte/Dockerfile
    ports:
      - "8010:8010"
    volumes:
      - agentic_akte_data:/data
    restart: unless-stopped

  coding-agent-guard:
    build:
      context: .
      dockerfile: apps/coding_agent_guard/Dockerfile
    ports:
      - "8020:8020"
    volumes:
      - coding_agent_guard_data:/data
    restart: unless-stopped

  prompt-optimizer:
    build:
      context: .
      dockerfile: apps/prompt_optimizer/Dockerfile
    ports:
      - "8030:8030"
    volumes:
      - prompt_optimizer_data:/data
    restart: unless-stopped

  memory-house:
    build:
      context: .
      dockerfile: apps/memory_house/Dockerfile
    ports:
      - "8040:8040"
    volumes:
      - memory_house_data:/data
    restart: unless-stopped

  memory-cockpit:
    build:
      context: .
      dockerfile: apps/memory_cockpit/Dockerfile
    ports:
      - "8050:8050"
    restart: unless-stopped

volumes:
  agentic_akte_data:
  coding_agent_guard_data:
  prompt_optimizer_data:
  memory_house_data:
